{{- if .Values.pdb.enabled }}
{{- range $component := list "api" "frontend" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "netops.name" $ }}-{{ $component }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, component: {{ $component }}}
{{- end }}
{{- end }}
