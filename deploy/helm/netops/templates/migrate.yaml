apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "netops.name" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: migrate}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- include "netops.security" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          env:
            {{- include "netops.dbEnv" . | nindent 12 }}
          securityContext:
            {{- include "netops.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
