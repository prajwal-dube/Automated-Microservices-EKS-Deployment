apiVersion: v1
kind: Service
metadata:
  name: {{ include "netops.name" . }}-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, component: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "netops.name" . }}-postgres
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "netops.name" . }}-postgres
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          env:
            - {name: POSTGRES_DB, value: netops}
            - {name: POSTGRES_USER, value: netops}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: DB_PASSWORD}
          startupProbe:
            exec: {command: ["pg_isready", "-U", "netops", "-d", "netops"]}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "netops", "-d", "netops"]}
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "netops", "-d", "netops"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
