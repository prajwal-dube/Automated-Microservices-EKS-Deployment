apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netops.name" . }}-api
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        {{- include "netops.security" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: api}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          securityContext:
            {{- include "netops.containerSecurity" . | nindent 12 }}
          env:
            {{- include "netops.dbEnv" . | nindent 12 }}
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: INGEST_TOKEN}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 8
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netops.name" . }}-api
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, component: api}
  ports: [{name: http, port: 8000, targetPort: http}]
