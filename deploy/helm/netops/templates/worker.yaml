apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netops.name" . }}-worker
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One worker; recreate avoids duplicate probes during rolling updates.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: worker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "netops.security" . | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          securityContext:
            {{- include "netops.containerSecurity" . | nindent 12 }}
          env:
            - name: API_URL
              value: {{ printf "http://%s-api:8000" (include "netops.name" .) | quote }}
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: INGEST_TOKEN}
            - name: PROBE_INTERVAL_SECONDS
              value: {{ .Values.worker.intervalSeconds | quote }}
            - name: PROBE_TARGETS
              valueFrom:
                configMapKeyRef: {name: {{ include "netops.name" . }}-probes, key: targets.json}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netops.name" . }}-probes
data:
  targets.json: >-
    [{"name":"api","url":"http://{{ include "netops.name" . }}-api:8000/readyz"},
    {"name":"frontend","url":"http://{{ include "netops.name" . }}-frontend:8080/healthz"}]
